# Toolchain + tasks for OpenShop. Run `mise install` once, then `mise run <task>`.
[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt" }
# Builds the documentation in `docs/`.
mdbook = "0.5.4"

[tasks."db:up"]
description = "Start PostgreSQL on localhost:5432, and wait until it accepts connections"
run = "docker compose up -d --wait"

[tasks."db:down"]
description = "Stop PostgreSQL (the data volume is kept)"
run = "docker compose down"

[tasks.fmt]
description = "Format the workspace"
run = "cargo fmt --all"

[tasks.lint]
description = "Clippy on the whole workspace, warnings are errors"
run = "cargo clippy --workspace --all-targets --locked -- -D warnings"

[tasks.test]
description = "Run the test suite (needs PostgreSQL: `mise run db:up`, or set DATABASE_URL)"
# Each test owns a schema and a small pool: cap parallelism to stay under max_connections.
run = "cargo test --workspace --locked -- --test-threads=4"

[tasks.check]
description = "fmt check + clippy + tests"
depends = ["lint", "test"]
run = "cargo fmt --all -- --check"

[tasks."dev:custom"]
description = "Work on the framework with the custom app template: its admin on http://localhost:3999/?shop=preview.myshopify.com&embedded=1 without a Shopify store, restarted and reloaded when the workspace changes (needs PostgreSQL: `mise run db:up`, or set DATABASE_URL)"
dir = "templates/custom"
env = { PREVIEW_AS_SHOP = "1" }
# The preview as a shop, run by `openshop dev`.
run = "cargo run -p openshop-cli -- dev --example preview-custom"

[tasks."dev:public"]
description = "The same with the public app template, on http://localhost:3998: an admin made of its own pages, and the operator dashboard at /ops"
dir = "templates/public"
env = { PREVIEW_AS_SHOP = "1" }
run = "cargo run -p openshop-cli -- dev --example preview-public"

[tasks."store:custom"]
description = "Run the custom app template in development mode in a development store, restarted and reloaded when the workspace changes (needs templates/custom/.env)"
dir = "templates/custom"
run = "cargo run -p openshop-cli -- dev"

[tasks."store:public"]
description = "Run the public app template in development mode in a development store, restarted and reloaded when the workspace changes (needs templates/public/.env)"
dir = "templates/public"
run = "cargo run -p openshop-cli -- dev"

[tasks."preview:custom"]
description = "Preview the custom app template on http://localhost:3999 without a Shopify store"
run = "cargo run -p openshop-template-custom --example preview-custom"

[tasks."preview:public"]
description = "Preview the public app template on http://localhost:3998 without a Shopify store"
run = "cargo run -p openshop-template-public --example preview-public"

[tasks.init]
description = "Make a project from a template with the openshop CLI of the workspace, depending on this checkout: `mise run init -- <dir> [--template=<name>]`"
run = "cargo run -q -p openshop-cli -- init --openshop-path=crates/openshop"

[tasks."docs:build"]
description = "Build the documentation into docs/book"
run = "mdbook build docs"

[tasks."docs:serve"]
description = "Serve the documentation with live reload"
run = "mdbook serve docs --open"

[tasks.install]
description = "Build the openshop CLI and install it into ~/.cargo/bin"
run = "cargo install --path crates/openshop-cli --locked"
