# Toolchain + tasks for OpenShop. Run `mise install` once, then `mise run <task>`.
[tools]
rust = { version = "1.98.1", components = "clippy,rustfmt", targets = "wasm32-unknown-unknown" }
# Builds the admin UI bundles (`crates/openshop-ui`, the demos in `apps/`).
"github:trunk-rs/trunk" = "0.21.14"
# Builds the documentation in `docs/`.
mdbook = "0.5.4"

[tasks."db:up"]
description = "Start PostgreSQL on localhost:5432"
run = "docker compose up -d"

[tasks."db:down"]
description = "Stop PostgreSQL (the data volume is kept)"
run = "docker compose down"

[tasks.fmt]
description = "Format the workspace and the admin UI workspace"
run = [
  "cargo fmt --all",
  "cargo fmt --manifest-path crates/openshop-ui/Cargo.toml",
]

[tasks.lint]
description = "Clippy on the whole workspace, warnings are errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run the test suite (needs PostgreSQL: `mise run db:up`, or set DATABASE_URL)"
# Each test owns a schema and a small pool: cap parallelism to stay under max_connections.
run = "cargo test --workspace -- --test-threads=4"

[tasks.check]
description = "fmt check + clippy + tests"
depends = ["lint", "test"]
run = "cargo fmt --all -- --check"

[tasks."ui:check"]
description = "fmt check + clippy (wasm32) + tests of the admin UI workspace"
run = [
  "cargo fmt --manifest-path crates/openshop-ui/Cargo.toml -- --check",
  "cargo clippy --manifest-path crates/openshop-ui/Cargo.toml --target wasm32-unknown-unknown -- -D warnings",
  "cargo test --manifest-path crates/openshop-ui/Cargo.toml",
]

[tasks."ui:build"]
description = "Rebuild the embedded admin UI into crates/openshop/ui-dist (committed)"
dir = "crates/openshop-ui"
run = "trunk build --release"

[tasks."demo:ui"]
description = "Build the admin UI bundle of each demo, from its admin pages, into its dist"
run = [
  "cd apps/demo-custom && cargo run -p openshop-cli -- build-ui",
  "cd apps/demo-public && cargo run -p openshop-cli -- build-ui",
]

[tasks."dev:custom"]
description = "Work on the framework with the custom app demo: its admin UI on http://localhost:3999 without a Shopify store, restarted and reloaded when the workspace changes (needs PostgreSQL: `mise run db:up`, or set DATABASE_URL)"
dir = "apps/demo-custom"
env = { PREVIEW_AS_SHOP = "1" }
# The preview as a shop, run by `openshop dev`, which builds the demo's own bundle with trunk.
run = "cargo run -p openshop-cli -- dev --example preview-custom"

[tasks."dev:public"]
description = "The same with the public app demo, on http://localhost:3998: an admin made of its own pages, and the operator dashboard at /ops"
dir = "apps/demo-public"
env = { PREVIEW_AS_SHOP = "1" }
run = "cargo run -p openshop-cli -- dev --example preview-public"

[tasks."demo:custom"]
description = "Run the custom app demo in development mode, restarted and reloaded when the workspace changes (needs apps/demo-custom/.env)"
dir = "apps/demo-custom"
run = "cargo run -p openshop-cli -- dev"

[tasks."demo:public"]
description = "Run the public app demo in development mode, restarted and reloaded when the workspace changes (needs apps/demo-public/.env)"
dir = "apps/demo-public"
run = "cargo run -p openshop-cli -- dev"

[tasks."preview:custom"]
description = "Preview the custom app demo on http://localhost:3999 without a Shopify store"
run = "cargo run -p openshop-demo-custom --example preview-custom"

[tasks."preview:public"]
description = "Preview the public app demo on http://localhost:3998 without a Shopify store"
run = "cargo run -p openshop-demo-public --example preview-public"

[tasks."docs:build"]
description = "Build the documentation into docs/book"
run = "mdbook build docs"

[tasks."docs:serve"]
description = "Serve the documentation with live reload"
run = "mdbook serve docs --open"

[tasks.install]
description = "Build the openshop CLI and install it into ~/.cargo/bin"
run = "cargo install --path crates/openshop-cli --locked"
