# Toolchain + tasks for OpenShop. Run `mise install` once, then `mise run <task>`.
[tools]
rust = { version = "1.98.1", components = "clippy,rustfmt", targets = "wasm32-unknown-unknown" }
# Builds the admin UI bundles (`crates/openshop-ui`, `apps/demo`).
"github:trunk-rs/trunk" = "0.21.14"
# Builds the documentation in `docs/`.
mdbook = "0.5.4"

[tasks."db:up"]
description = "Start PostgreSQL on localhost:5432"
run = "docker compose up -d"

[tasks."db:down"]
description = "Stop PostgreSQL (the data volume is kept)"
run = "docker compose down"

[tasks.fmt]
description = "Format the workspace and the admin UI workspace"
run = [
  "cargo fmt --all",
  "cargo fmt --manifest-path crates/openshop-ui/Cargo.toml",
]

[tasks.lint]
description = "Clippy on the whole workspace, warnings are errors"
run = "cargo clippy --workspace --all-targets -- -D warnings"

[tasks.test]
description = "Run the test suite (needs PostgreSQL: `mise run db:up`, or set DATABASE_URL)"
# Each test owns a schema and a small pool: cap parallelism to stay under max_connections.
run = "cargo test --workspace -- --test-threads=4"

[tasks.check]
description = "fmt check + clippy + tests"
depends = ["lint", "test"]
run = "cargo fmt --all -- --check"

[tasks."ui:check"]
description = "fmt check + clippy (wasm32) + tests of the admin UI workspace"
run = [
  "cargo fmt --manifest-path crates/openshop-ui/Cargo.toml -- --check",
  "cargo clippy --manifest-path crates/openshop-ui/Cargo.toml --target wasm32-unknown-unknown -- -D warnings",
  "cargo test --manifest-path crates/openshop-ui/Cargo.toml",
]

[tasks."ui:build"]
description = "Rebuild the embedded admin UI into crates/openshop/ui-dist (committed)"
dir = "crates/openshop-ui"
run = "trunk build --release"

[tasks."demo:ui"]
description = "Build the demo's own admin UI bundle, from its admin pages, into apps/demo/dist"
dir = "apps/demo"
run = "cargo run -p openshop-cli -- build-ui"

[tasks.demo]
description = "Run the demo app in development mode (needs apps/demo/.env)"
dir = "apps/demo"
run = "cargo run -p openshop-demo -- dev"

[tasks.preview]
description = "Preview the admin UI on http://localhost:3999 without a Shopify store"
run = "cargo run -p openshop-demo --example preview"

[tasks."docs:build"]
description = "Build the documentation into docs/book"
run = "mdbook build docs"

[tasks."docs:serve"]
description = "Serve the documentation with live reload"
run = "mdbook serve docs --open"

[tasks.install]
description = "Build the openshop CLI and install it into ~/.cargo/bin"
run = "cargo install --path crates/openshop-cli --locked"
