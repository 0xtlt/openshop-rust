# Template — Run `shopify app config link` to generate your shopify.app.<name>.toml

client_id = ""
name = "openshop-template-custom"
application_url = "https://localhost:3000"
embedded = true

[build]
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[webhooks]
api_version = "2026-10"

[access_scopes]
# The discounts: the instances of the volume discount Function, which the
# Functions page of the admin lists, creates, updates and deletes.
scopes = "read_products,read_orders,read_discounts,write_discounts"

[auth]
redirect_urls = [ "https://localhost:3000/auth/callback" ]
