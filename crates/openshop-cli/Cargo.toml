[package]
name = "openshop-cli"
description = "Command-line tool for scaffolding and developing OpenShop applications."
keywords = ["shopify", "framework", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["src/**", "templates/**", "Cargo.toml"]

[[bin]]
name = "openshop"
path = "src/main.rs"

[dependencies]
openshop.workspace = true

anyhow.workspace = true
notify.workspace = true
tokio.workspace = true

[lints.rust]
unsafe_code = "forbid"
