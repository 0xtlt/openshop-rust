[package]
name = "openshop-cli"
description = "Command-line tool for scaffolding and developing OpenShop applications."
keywords = ["shopify", "framework", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
# The templates of `openshop init` are read from `templates/` at the root of the repository,
# the shell of an admin UI bundle from `crates/openshop-ui`.
include = ["src/**", "templates/**", "build.rs", "Cargo.toml"]

[[bin]]
name = "openshop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
notify.workspace = true
# Reads the sources of a project for the admin pages that have a view.
proc-macro2 = { workspace = true, features = ["span-locations"] }
# Reads `cargo metadata`.
serde_json.workspace = true
syn = { workspace = true, features = ["visit"] }
tokio.workspace = true
# The questions of `openshop init`.
dialoguer.workspace = true
toml_edit.workspace = true

[dev-dependencies]
# The migrations a project gets are the ones of the framework.
openshop.workspace = true

[lints]
workspace = true
