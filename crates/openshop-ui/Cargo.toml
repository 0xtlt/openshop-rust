[package]
name = "openshop-ui"
description = "Embedded Shopify admin UI of OpenShop, compiled to WebAssembly with Leptos."
version = "0.0.12-beta.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/0xtlt/openshop-rust"
homepage = "https://openshop.run/"
authors = ["Thomas Tastet"]

# Built with trunk for wasm32; kept out of the server workspace on purpose.
[workspace]

[dependencies]
openshop-shared = { path = "../openshop-shared", version = "0.0.12-beta.0" }

console_error_panic_hook = "0.1"
futures-util = { version = "0.3", default-features = false }
gloo-timers = { version = "0.4", features = ["futures"] }
indexmap = { version = "2", features = ["serde"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
send_wrapper = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
  "AbortController",
  "AbortSignal",
  "Blob",
  "BlobPropertyBag",
  "console",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "Headers",
  "History",
  "HtmlAnchorElement",
  "HtmlElement",
  "Location",
  "Navigator",
  "RequestInit",
  "Response",
  "Url",
  "VisibilityState",
  "Window",
] }

# Native builds only exist for `cargo test`; the browser's own URL parser is used on wasm.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
url = "2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
