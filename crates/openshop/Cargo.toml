[package]
name = "openshop"
description = "Shopify integration framework with flows, providers, an admin rendered by the server, and background workers."
keywords = ["shopify", "framework", "axum", "postgres", "workflow"]
categories = ["web-programming", "asynchronous"]
readme = "../../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["src/**", "migrations/**", "build.rs", "Cargo.toml"]

# The schema the tests' `graphql!` operations are checked against.
[package.metadata.shopify_api]
api-version = "2026-10"

[features]
default = ["sentry"]
# Report failed runs, failed handlers and panics to Sentry: the `sentry` setting
# of `app!`. An event is named after the route its request matched.
sentry = ["dep:sentry", "axum/matched-path"]
# Test harness: isolated databases, fake providers, signed requests.
testing = ["shopify_api/testing"]

[dependencies]
openshop-macros.workspace = true

anyhow.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
aes-gcm.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
croner.workspace = true
futures.workspace = true
hex.workspace = true
hmac.workspace = true
indexmap.workspace = true
maud.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
scrypt.workspace = true
sentry = { workspace = true, optional = true }
serde_urlencoded.workspace = true
sha2.workspace = true
shopify_api.workspace = true
sqlx.workspace = true
subtle.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
openshop = { path = ".", features = ["testing"] }
# The views of the admin pages of the tests: `html!` names `maud`.
maud.workspace = true
# The transport that keeps events, for `tests/sentry.rs`.
sentry = { workspace = true, features = ["test"] }
tokio = { workspace = true, features = ["io-util", "test-util"] }
# The errors of the macros, `tests/macros.rs`.
trybuild = "1"
# Decodes the toasts of the admin pages, percent-encoded.
percent-encoding = "2"

[lints]
workspace = true
