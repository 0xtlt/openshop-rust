[workspace]
resolver = "3"
members = [
  "crates/openshop",
  "crates/openshop-shared",
  "crates/openshop-graphql",
  "crates/openshop-macros",
  "crates/openshop-cli",
  "apps/demo",
]
# The admin UI targets wasm32 and is built with trunk; it has its own lockfile.
exclude = ["crates/openshop-ui"]

[workspace.package]
version = "0.0.12-beta.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/0xtlt/openshop-rust"
homepage = "https://openshop.run/"
authors = ["Thomas Tastet"]

[workspace.dependencies]
openshop = { path = "crates/openshop", version = "0.0.12-beta.0" }
openshop-shared = { path = "crates/openshop-shared", version = "0.0.12-beta.0" }
openshop-graphql = { path = "crates/openshop-graphql", version = "0.0.12-beta.0" }
openshop-macros = { path = "crates/openshop-macros", version = "0.0.12-beta.0" }

aes-gcm = "0.10"
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
croner = "3"
futures = { version = "0.3", default-features = false, features = ["std", "alloc"] }
graphql-parser = "0.4"
hex = "0.4"
hmac = "0.12"
indexmap = { version = "2", features = ["serde"] }
mime_guess = "2"
notify = "8"
proc-macro2 = "1"
quote = "1"
rand = "0.9"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rust-embed = { version = "8", features = ["debug-embed"] }
schemars = "1"
scrypt = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_path_to_error = "0.1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "derive", "json", "postgres", "runtime-tokio", "tls-rustls-ring-webpki", "uuid"] }
subtle = "2"
syn = { version = "2", features = ["full"] }
tokio = { version = "1", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "cors", "set-header"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }

# MCP token hashing (scrypt) is very slow without optimizations.
[profile.dev.package.scrypt]
opt-level = 3

[profile.dev.package.salsa20]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
