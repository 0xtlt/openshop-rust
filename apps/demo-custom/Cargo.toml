[package]
name = "openshop-demo-custom"
description = "Demo of a custom app: every OpenShop building block, with the built-in admin open to the merchant."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
openshop = { workspace = true, features = ["ui"] }
serde.workspace = true
# The views of the admin pages.
leptos = "0.8"

[dev-dependencies]
openshop = { workspace = true, features = ["testing"] }
# What `examples/preview-custom.rs` runs.
openshop-demo-preview = { path = "../preview" }
