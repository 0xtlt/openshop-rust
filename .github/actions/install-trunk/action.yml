name: Install trunk
description: >-
  Installs trunk from its GitHub release, after checking the SHA-256 of the
  archive that is written here: a release asset can be replaced, this fails
  when it is. Keep the version in step with mise.toml; a new version needs the
  digest of its x86_64-unknown-linux-gnu archive (`<asset>.sha256` of the
  release, or `sha256sum` of the download).
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: v0.21.14
        SHA256: f2b4680cd239693a646a2795e4633c625328d7b2a044fbe749fa3a2fe9e7036b
      run: |
        set -euo pipefail
        asset=trunk-x86_64-unknown-linux-gnu.tar.gz
        dir="$(mktemp -d)"
        gh release download "$VERSION" --repo trunk-rs/trunk --pattern "$asset" --dir "$dir"
        echo "$SHA256  $dir/$asset" | sha256sum --check -
        mkdir -p "$HOME/.local/bin"
        tar -xzf "$dir/$asset" -C "$HOME/.local/bin" trunk
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
