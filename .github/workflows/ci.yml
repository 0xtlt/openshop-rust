name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgresql://openshop:openshop@localhost:5432/openshop

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Each test binary is linked with its own copy of the debug info of what
      # it depends on: `target/` reaches 21 GB with it, and the runner has 14 GB
      # free. A failed test names its file and line without it.
      CARGO_PROFILE_DEV_DEBUG: 0
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openshop
          POSTGRES_USER: openshop
          POSTGRES_PASSWORD: openshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openshop -d openshop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Each test owns a schema and a small pool: cap parallelism to stay under
      # the default max_connections of the service container.
      - run: cargo test --workspace -- --test-threads=4

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/openshop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/openshop-ui
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      - uses: jetli/trunk-action@v0.5.0
      - run: trunk build --release --dist target/ui-dist

  # The custom and public templates have admin pages with a view: `openshop
  # build-ui` compiles them to WebAssembly, into their own admin UI bundle.
  templates-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.0
      - run: cargo run -p openshop-cli -- build-ui
        working-directory: templates/custom
      - run: cargo run -p openshop-cli -- build-ui
        working-directory: templates/public

  # `check` tests the templates as members of the workspace; this checks the
  # projects `openshop init` makes of them, on their own.
  init:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p openshop-cli
      - name: Check a project made from each template
        run: |
          for template in minimal custom public; do
            target/debug/openshop init "$RUNNER_TEMP/app-$template" --template=$template --openshop-path=crates/openshop
            cp Cargo.lock "$RUNNER_TEMP/app-$template/"
            (cd "$RUNNER_TEMP/app-$template" && cargo fmt --check && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo check --all-targets)
          done
