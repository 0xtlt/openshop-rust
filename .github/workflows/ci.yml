name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgresql://openshop:openshop@localhost:5432/openshop

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openshop
          POSTGRES_USER: openshop
          POSTGRES_PASSWORD: openshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openshop -d openshop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Each test owns a schema and a small pool: cap parallelism to stay under
      # the default max_connections of the service container.
      - run: cargo test --workspace -- --test-threads=4

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/openshop-ui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/openshop-ui
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-unknown-unknown -- -D warnings
      - run: cargo test
      - uses: jetli/trunk-action@v0.5.0
      - run: trunk build --release --dist target/ui-dist

  # Each demo has admin pages with a view: `openshop build-ui` compiles them
  # to WebAssembly, into its own admin UI bundle.
  demo-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.0
      - run: cargo run -p openshop-cli -- build-ui
        working-directory: apps/demo-custom
      - run: cargo run -p openshop-cli -- build-ui
        working-directory: apps/demo-public
