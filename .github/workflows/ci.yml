name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgresql://openshop:openshop@localhost:5432/openshop

# Nothing here writes to the repository or to GitHub: a job that needs more asks
# for it on its own.
permissions:
  contents: read

# Every action is pinned to the commit of a release, the release in the comment
# next to it: a tag can be moved, a commit cannot. Dependabot proposes the next
# one. `dtolnay/rust-toolchain` has no release, its commit is the one of its
# `master` branch, and the toolchain is the one of `mise.toml`, so that CI runs
# what a contributor runs.

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Each test binary is linked with its own copy of the debug info of what
      # it depends on: `target/` reaches 21 GB with it, and the runner has 14 GB
      # free. A failed test names its file and line without it.
      CARGO_PROFILE_DEV_DEBUG: 0
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openshop
          POSTGRES_USER: openshop
          POSTGRES_PASSWORD: openshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openshop -d openshop"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Each test owns a schema and a small pool: cap parallelism to stay under
      # the default max_connections of the service container.
      - run: cargo test --workspace --locked -- --test-threads=4

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/openshop-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: crates/openshop-ui
      - run: cargo fmt --check
      - run: cargo clippy --target wasm32-unknown-unknown --locked -- -D warnings
      - run: cargo test --locked
      - uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: v0.21.14
      - run: trunk build --release --locked --dist target/ui-dist

  # The custom and public templates have admin pages with a view: `openshop
  # build-ui` compiles them to WebAssembly, into their own admin UI bundle.
  templates-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.1"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: jetli/trunk-action@1346cc09eace4beb84e403e199a471346d4684c9 # v0.5.1
        with:
          version: v0.21.14
      - run: cargo run -p openshop-cli --locked -- build-ui
        working-directory: templates/custom
      - run: cargo run -p openshop-cli --locked -- build-ui
        working-directory: templates/public

  # `check` tests the templates as members of the workspace; this checks the
  # projects `openshop init` makes of them, on their own.
  init:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.1"
          components: rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo build -p openshop-cli --locked
      - name: Check a project made from each template
        run: |
          for template in minimal custom public; do
            target/debug/openshop init "$RUNNER_TEMP/app-$template" --template=$template --openshop-path=crates/openshop
            cp Cargo.lock "$RUNNER_TEMP/app-$template/"
            (cd "$RUNNER_TEMP/app-$template" && cargo fmt --check && CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo check --all-targets)
          done

  # What a user gets from `cargo install --git` then `openshop init`, with no
  # path: a project that depends on the framework through git, on the commit
  # under test, which cargo has to fetch from GitHub.
  init-git:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      # The repository is private: cargo fetches it with git, which is given
      # the token of the job.
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The head of a pull request, which GitHub serves, not its merge commit.
      COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: "1.98.1"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - run: cargo build -p openshop-cli --locked
      - name: Depend on the commit the CLI is built from
        run: |
          target/debug/openshop init "$RUNNER_TEMP/default" --template=minimal
          grep -F "rev = \"$(git rev-parse HEAD)\"" "$RUNNER_TEMP/default/Cargo.toml"
      - name: Check a project that depends on the commit under test
        run: |
          target/debug/openshop init "$RUNNER_TEMP/app" --template=minimal --openshop-rev="$COMMIT"
          cp Cargo.lock "$RUNNER_TEMP/app/"
          cd "$RUNNER_TEMP/app"
          CARGO_TARGET_DIR="$GITHUB_WORKSPACE/target" cargo check --all-targets

  # The version in `rust-version` of Cargo.toml (and of the admin UI) is a
  # promise: this is what keeps it.
  msrv:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          # Keep in step with `rust-version`.
          toolchain: "1.88"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            crates/openshop-ui
      - run: cargo check --workspace --all-targets --locked
      - run: cargo check --all-targets --target wasm32-unknown-unknown --locked
        working-directory: crates/openshop-ui

  # Advisories, licenses and sources of the dependencies, as `deny.toml` says;
  # the admin UI workspace has its own lockfile.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: crates/openshop-ui/Cargo.toml
