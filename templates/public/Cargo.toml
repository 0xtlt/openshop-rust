[package]
name = "openshop-template-public"
description = "Template of `openshop init --template=public`, a public app: an admin made of its own pages for the merchants, the operator dashboard for whoever runs it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The Admin API version `graphql!` checks the operations against and sends
# them to. Its schema is `graphql/admin.schema.json`: after a change, run
# `shopify-api schema download` here (`cargo install shopify_api --features cli`).
[package.metadata.shopify_api]
api-version = "2026-10"

[dependencies]
openshop.workspace = true
serde.workspace = true
# The HTML of the views of the admin pages, which the server renders: `html!`.
maud.workspace = true

[dev-dependencies]
openshop = { workspace = true, features = ["testing"] }
# What `examples/preview-public.rs` runs.
openshop-preview = { path = "../../apps/preview" }

[lints]
workspace = true
