[package]
name = "openshop-template-custom"
description = "Template of `openshop init --template=custom`, a custom app: every OpenShop building block, with the built-in admin open to the merchant."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The Admin API version `graphql!` checks the operations against and sends
# them to. The first build downloads its schema into `graphql/admin.schema.json`.
[package.metadata.shopify_api]
api-version = "2026-10"

[dependencies]
openshop = { workspace = true, features = ["ui"] }
serde.workspace = true
# What `graphql!` generates names this crate.
shopify_api.workspace = true
# The views of the admin pages.
leptos = "0.8"

[dev-dependencies]
openshop = { workspace = true, features = ["testing"] }
# What `examples/preview-custom.rs` runs.
openshop-preview = { path = "../../apps/preview" }

[lints]
workspace = true
