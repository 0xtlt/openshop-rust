[package]
name = "openshop-template-minimal"
description = "Template of `openshop init --template=minimal`: one provider and one flow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The Admin API version `graphql!` checks the operations against and sends
# them to. The first build downloads its schema into `graphql/admin.schema.json`.
[package.metadata.shopify_api]
api-version = "2026-10"

[dependencies]
openshop.workspace = true
serde.workspace = true
# What `graphql!` generates names this crate.
shopify_api.workspace = true

[dev-dependencies]
openshop = { workspace = true, features = ["testing"] }

[lints]
workspace = true
