[package]
name = "openshop-template-minimal"
description = "Template of `openshop init --template=minimal`: one provider and one flow."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# The Admin API version `graphql!` checks the operations against and sends
# them to. Its schema is `graphql/admin.schema.json`: after a change, run
# `shopify-api schema download` here (`cargo install shopify_api --features cli`).
[package.metadata.shopify_api]
api-version = "2026-10"

[dependencies]
openshop.workspace = true
serde.workspace = true

[dev-dependencies]
openshop = { workspace = true, features = ["testing"] }

[lints]
workspace = true
